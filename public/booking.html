<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Event | EventAura</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="booking-page">

<header class="navbar">
    <div class="logo">Event<span>Aura</span></div>

   <nav>
    <a href="index.html">Home</a>
    <a href="event.html">Events</a>
    <a href="upcoming.html">Upcoming</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
</nav>
</header>

<section class="booking-section">

    <div class="section-heading">
        <p>RESERVE YOUR SPOT</p>
        <h1>Book Your <span>Event</span></h1>
        <p>Make your college experience unforgettable.</p>
    </div>

    <div class="booking-container">

        <h2>Event Registration</h2>

        <form id="bookingForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>College Name</label>
            <input type="text" id="college" placeholder="Enter your college" required>

            <label>Select Event</label>
            <select id="event" required>
                <option value="">Choose an event</option>
                <option>Live Concert</option>
                <option>College Fest</option>
                <option>Tech Fest</option>
                <option>Cultural Night</option>
            </select>

            <label>Number of Tickets</label>
            <input type="number" id="tickets" min="1" max="500" value="1" required>

            <label>Event Date</label>
            <input type="date" id="date" required>

            <button type="submit">Confirm Booking →</button>

        </form>

        <p id="bookingMessage"></p>

    </div>
</section>

<footer>
    <div class="footer-logo">Event<span>Aura</span></div>
    <p>Making College Events Special ✨</p>
    <p>© 2026 EventAura. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
